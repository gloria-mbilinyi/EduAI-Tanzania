name: EduAI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pytest tests -q --junitxml=../docs/testing/pytest-results.xml
        working-directory: backend
      - name: Verify generated API contract
        run: python -c "import json,pathlib; from app.main import app; assert app.openapi()==json.loads(pathlib.Path('../docs/api/openapi.json').read_text())"
        working-directory: backend
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: node scripts/check_i18n.mjs
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Generate temporary fictional account password
        run: python -c "import secrets,os; open(os.environ['GITHUB_ENV'],'a').write('EDUAI_DEMO_PASSWORD='+secrets.token_urlsafe(24)+'\n')"
      - run: python -m app.seed
        working-directory: backend
      - name: Start local services
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/eduai-api.log 2>&1 &
          cd ../frontend
          npm run dev > /tmp/eduai-ui.log 2>&1 &
          python -c "import urllib.request,time; [(time.sleep(1)) for _ in range(5)]; urllib.request.urlopen('http://127.0.0.1:8000/api/health'); urllib.request.urlopen('http://127.0.0.1:5173')"
      - run: npm run test:e2e
        working-directory: frontend
